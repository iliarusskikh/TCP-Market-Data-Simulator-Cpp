# TCP Market Data Simulator — shared defaults
# From build/:  ./server ../config/default.conf
#               ./client ../config/default.conf [max_ticks]

host=127.0.0.1
port=8080

# Comma-separated symbol IDs (server walks each in round-robin)
symbols=1,2,3

# Ticks per second (global broadcast rate)
tick_rate_hz=10

# Prices are scaled integers (micros): 100000000 == 100.0
# Generator seed is fixed at 42 in server.cpp for reproducible demos

# Application heartbeats + client reconnect
heartbeat_interval_ms=1000
heartbeat_timeout_ms=3000
reconnect_max_retries=10
reconnect_initial_ms=100
